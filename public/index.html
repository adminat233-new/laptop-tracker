<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>Laptop Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Pairing Screen */
    #pair-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
    }

    .pair-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .pair-icon {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 42px;
    }

    .pair-card h1 { font-size: 24px; margin-bottom: 8px; }
    .pair-card p { color: #888; font-size: 13px; margin-bottom: 24px; }

    /* Code Display (Laptop) */
    .code-display {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .code-box {
      width: 48px;
      height: 58px;
      background: rgba(0,212,255,0.15);
      border: 2px solid #00d4ff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #00d4ff;
      text-transform: uppercase;
    }

    /* Code Input (Phone) */
    .code-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .code-input {
      width: 48px;
      height: 58px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      outline: none;
      transition: all 0.2s;
      caret-color: #00d4ff;
    }

    .code-input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0,212,255,0.3);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      color: #fff;
    }

    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      margin-top: 10px;
    }

    .error-text { color: #ff4444; font-size: 12px; margin-top: 12px; min-height: 18px; }
    .success-text { color: #00ff88; font-size: 12px; margin-top: 12px; }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #666;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .divider span { padding: 0 12px; }

    /* Main Dashboard */
    #dashboard {
      display: none;
      min-height: 100vh;
      padding-bottom: 280px;
    }

    #dashboard.active { display: block; }

    .header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .device-info { display: flex; align-items: center; gap: 10px; }

    .device-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }

    .device-name { font-size: 15px; font-weight: 600; }

    .status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #888;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }

    .status-dot.online { background: #00ff88; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Map */
    #map {
      position: fixed;
      top: 66px; left: 0; right: 0;
      height: 38vh;
      z-index: 1;
    }

    /* Info Panel */
    .info-panel {
      position: relative;
      z-index: 10;
      margin-top: calc(38vh + 66px);
      padding: 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .info-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; font-size: 12px; }
    .info-value { font-size: 12px; font-weight: 500; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 9px; color: #888; margin-top: 2px; }

    /* Controls Panel */
    .controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px 20px;
      border-radius: 20px 20px 0 0;
      z-index: 100;
    }

    .controls-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .alarm-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .alarm-btn {
      padding: 10px 4px;
      border: none;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      transition: all 0.2s;
    }

    .alarm-btn:active { transform: scale(0.92); }
    .alarm-btn .icon { font-size: 18px; }
    .alarm-btn.siren { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .alarm-btn.alarm { background: linear-gradient(135deg, #ff8800, #cc6600); }
    .alarm-btn.noise { background: linear-gradient(135deg, #ff00ff, #cc00cc); }
    .alarm-btn.sensor { background: linear-gradient(135deg, #ffff00, #cccc00); color: #000; }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-btn {
      padding: 10px 4px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 9px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .action-btn:active { background: rgba(255,255,255,0.15); }
    .action-btn .icon { font-size: 16px; }
    .action-btn.danger { border-color: rgba(255,68,68,0.3); color: #ff4444; }

    /* Toast */
    .toast {
      position: fixed;
      top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0,212,255,0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Markers */
    .custom-marker { background: none; border: none; }
    .marker-laptop {
      width: 22px; height: 22px;
      background: #00d4ff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,212,255,0.6);
    }
    .marker-phone {
      width: 22px; height: 22px;
      background: #00ff88;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,255,136,0.6);
    }

    /* Loading spinner */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Pairing Screen -->
  <div id="pair-screen">
    <div class="pair-card">
      <div class="pair-icon">🔗</div>
      <h1 id="pair-title">Laptop Tracker</h1>
      <p id="pair-subtitle">Generate a code on your laptop, then enter it here</p>

      <!-- For LAPTOP: Show generated code -->
      <div id="laptop-section" style="display:none;">
        <div class="code-display" id="code-display"></div>
        <button class="btn btn-primary" id="generate-btn" style="margin-bottom:10px;">Generate New Code</button>
        <button class="btn btn-secondary" id="copy-code-btn">Copy Code</button>
        <p class="success-text" id="wait-text" style="display:none;">
          <span class="spinner"></span><br>Waiting for phone to connect...
        </p>
      </div>

      <!-- For PHONE: Show input boxes -->
      <div id="phone-section" style="display:none;">
        <div class="code-inputs" id="code-inputs"></div>
        <button class="btn btn-primary" id="connect-btn" disabled>Connect to Laptop</button>
      </div>

      <div class="error-text" id="pair-error"></div>
      <div class="success-text" id="pair-success"></div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <header class="header">
      <div class="header-content">
        <div class="device-info">
          <div class="device-icon">💻</div>
          <div>
            <div class="device-name" id="device-name">Laptop</div>
            <div class="status-badge">
              <div class="status-dot online" id="status-dot"></div>
              <span id="status-text">Connected</span>
            </div>
          </div>
        </div>
        <div style="font-size:10px; color:#888;" id="last-seen">--</div>
      </div>
    </header>

    <div id="map"></div>

    <div class="info-panel">
      <div class="section-title">Laptop Location</div>
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">City</span>
          <span class="info-value" id="loc-city">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Region</span>
          <span class="info-value" id="loc-region">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Country</span>
          <span class="info-value" id="loc-country">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">IP</span>
          <span class="info-value" id="loc-ip">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Coordinates</span>
          <span class="info-value" id="loc-coords">--</span>
        </div>
      </div>

      <div class="section-title">System Status</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-cpu">--</div>
          <div class="stat-label">CPU</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-ram">--</div>
          <div class="stat-label">RAM</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-uptime">--</div>
          <div class="stat-label">Uptime</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="controls-handle"></div>
      
      <div class="section-title">Alarms</div>
      <div class="alarm-grid">
        <button class="alarm-btn siren" onclick="sendCommand('siren')">
          <span class="icon">🚨</span> Siren
        </button>
        <button class="alarm-btn alarm" onclick="sendCommand('alarm')">
          <span class="icon">🔔</span> Alarm
        </button>
        <button class="alarm-btn noise" onclick="sendCommand('noise')">
          <span class="icon">🔊</span> Noise
        </button>
        <button class="alarm-btn sensor" onclick="sendCommand('sensor')">
          <span class="icon">⚠️</span> Sensor
        </button>
      </div>

      <div class="section-title">Actions</div>
      <div class="action-grid">
        <button class="action-btn" onclick="sendCommand('lock')">
          <span class="icon">🔒</span> Lock
        </button>
        <button class="action-btn" onclick="sendCommand('netscan')">
          <span class="icon">🌐</span> Scan
        </button>
        <button class="action-btn" onclick="sendCommand('sysinfo')">
          <span class="icon">📊</span> Info
        </button>
        <button class="action-btn danger" onclick="confirmShutdown()">
          <span class="icon">⏻</span> Shutdown
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============= CONFIGURATION =============
    const CODE_LENGTH = 8;
    let ws = null;
    let map = null;
    let laptopMarker = null;
    let phoneMarker = null;
    let deviceId = null;
    let currentCode = null;
    let isLaptop = false;
    let pairKey = null;

    // ============= DETECT DEVICE TYPE =============
    function detectDevice() {
      const params = new URLSearchParams(window.location.search);
      
      // Check URL param first
      if (params.get('role') === 'laptop') {
        isLaptop = true;
        return;
      }
      if (params.get('role') === 'phone') {
        isLaptop = false;
        return;
      }

      // Auto-detect based on screen size and platform
      const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isSmallScreen = window.innerWidth < 768;
      
      isLaptop = !isMobile && !isSmallScreen;
    }

    // ============= CODE GENERATION =============
    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // No I,O,0,1 to avoid confusion
      let code = '';
      for (let i = 0; i < CODE_LENGTH; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    function displayCode(code) {
      const container = document.getElementById('code-display');
      container.innerHTML = '';
      for (let i = 0; i < code.length; i++) {
        const box = document.createElement('div');
        box.className = 'code-box';
        box.textContent = code[i];
        container.appendChild(box);
      }
    }

    function createInputBoxes() {
      const container = document.getElementById('code-inputs');
      container.innerHTML = '';
      
      for (let i = 0; i < CODE_LENGTH; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'code-input';
        input.maxLength = 1;
        input.dataset.index = i;
        input.inputMode = 'text';
        input.autocomplete = 'off';
        
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
          
          // Auto-advance
          if (e.target.value && i < CODE_LENGTH - 1) {
            container.children[i + 1].focus();
          }
          
          // Check if all filled
          checkCodeComplete();
        });
        
        input.addEventListener('keydown', (e) => {
          // Backspace: go to previous
          if (e.key === 'Backspace' && !e.target.value && i > 0) {
            container.children[i - 1].focus();
          }
          
          // Enter: try to connect
          if (e.key === 'Enter') {
            tryConnect();
          }
        });
        
        // Handle paste
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const paste = (e.clipboardData || window.clipboardData).getData('text');
          const chars = paste.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, CODE_LENGTH);
          
          for (let j = 0; j < chars.length && j < CODE_LENGTH; j++) {
            container.children[j].value = chars[j];
          }
          
          if (chars.length > 0) {
            const focusIdx = Math.min(chars.length, CODE_LENGTH - 1);
            container.children[focusIdx].focus();
          }
          
          checkCodeComplete();
        });
        
        container.appendChild(input);
      }
      
      // Focus first input
      setTimeout(() => container.children[0].focus(), 100);
    }

    function checkCodeComplete() {
      const inputs = document.querySelectorAll('.code-input');
      let code = '';
      inputs.forEach(input => code += input.value);
      
      const connectBtn = document.getElementById('connect-btn');
      connectBtn.disabled = code.length !== CODE_LENGTH;
    }

    function getEnteredCode() {
      const inputs = document.querySelectorAll('.code-input');
      let code = '';
      inputs.forEach(input => code += input.value);
      return code;
    }

    // ============= WEBSOCKET =============
    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        console.log('Connected to server');
        
        if (isLaptop) {
          // Register as laptop with code
          ws.send(JSON.stringify({
            type: 'laptop_register',
            pairKey: currentCode
          }));
        } else {
          // Verify code
          ws.send(JSON.stringify({
            type: 'phone_verify',
            pairKey: pairKey
          }));
        }
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };

      ws.onclose = () => {
        if (isLaptop) {
          document.getElementById('status-dot').classList.remove('online');
          document.getElementById('status-text').textContent = 'Disconnected';
        }
        setTimeout(connectWebSocket, 3000);
      };
    }

    function handleMessage(data) {
      switch (data.type) {
        // LAPTOP: Phone connected successfully
        case 'pair_success':
          document.getElementById('wait-text').innerHTML = '✓ Phone connected! Opening dashboard...';
          document.getElementById('wait-text').style.color = '#00ff88';
          deviceId = data.deviceId;
          
          setTimeout(() => {
            showDashboard();
            sendCommand('sysinfo');
            sendCommand('location');
          }, 1000);
          break;

        // PHONE: Verified, showing dashboard
        case 'verified':
          deviceId = data.deviceId;
          document.getElementById('device-name').textContent = data.deviceInfo?.hostname || 'Laptop';
          
          if (data.deviceLocation) {
            updateLaptopLocation(data.deviceLocation);
          }
          
          showDashboard();
          sendCommand('sysinfo');
          break;

        // PHONE: Pairing failed
        case 'pair_failed':
          document.getElementById('pair-error').textContent = data.error || 'Invalid code';
          document.getElementById('connect-btn').disabled = false;
          document.getElementById('connect-btn').textContent = 'Connect to Laptop';
          break;

        // Location update
        case 'location_update':
          updateLaptopLocation(data.location);
          document.getElementById('last-seen').textContent = 
            new Date(data.timestamp).toLocaleTimeString();
          break;

        // Command result
        case 'command_result':
          handleCommandResult(data);
          break;

        // Device went offline
        case 'device_offline':
          document.getElementById('status-dot').classList.remove('online');
          document.getElementById('status-text').textContent = 'Offline';
          break;

        // Device came online
        case 'device_online':
          document.getElementById('status-dot').classList.add('online');
          document.getElementById('status-text').textContent = 'Connected';
          break;
      }
    }

    // ============= UI FUNCTIONS =============
    function showDashboard() {
      document.getElementById('pair-screen').style.display = 'none';
      document.getElementById('dashboard').classList.add('active');
      
      if (!map) {
        setTimeout(initMap, 100);
      }
    }

    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        zoomControl: false
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      setTimeout(() => map.invalidateSize(), 300);

      // Track phone location
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            if (phoneMarker) {
              phoneMarker.setLatLng([latitude, longitude]);
            } else {
              phoneMarker = L.marker([latitude, longitude], {
                icon: L.divIcon({
                  className: 'custom-marker',
                  html: '<div class="marker-phone"></div>',
                  iconSize: [22, 22],
                  iconAnchor: [11, 11]
                })
              }).addTo(map);
            }
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
    }

    function updateLaptopLocation(location) {
      if (!map || !location || !location.lat) return;

      const latlng = [location.lat, location.lng];

      if (laptopMarker) {
        laptopMarker.setLatLng(latlng);
      } else {
        laptopMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-laptop"></div>',
            iconSize: [22, 22],
            iconAnchor: [11, 11]
          })
        }).addTo(map);
      }

      map.setView(latlng, 14);

      document.getElementById('loc-city').textContent = location.city || '--';
      document.getElementById('loc-region').textContent = location.region || '--';
      document.getElementById('loc-country').textContent = location.country || '--';
      document.getElementById('loc-ip').textContent = location.ip || '--';
      document.getElementById('loc-coords').textContent = 
        `${location.lat?.toFixed(4)}, ${location.lng?.toFixed(4)}`;
    }

    function sendCommand(type, params = {}) {
      if (!deviceId) {
        showToast('Not connected');
        return;
      }

      fetch('/api/command/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceId, type, params })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showToast(`${type} sent!`);
        } else {
          showToast('Failed to send');
        }
      })
      .catch(() => showToast('Error'));
    }

    function handleCommandResult(data) {
      if (data.commandType === 'sysinfo' && data.result) {
        try {
          const output = typeof data.result === 'string' ? data.result : JSON.stringify(data.result);
          const cpuMatch = output.match(/LoadPercentage=(\d+)/);
          const freeMem = output.match(/FreePhysicalMemory=(\d+)/);
          const totalMem = output.match(/TotalVisibleMemorySize=(\d+)/);
          
          if (cpuMatch) document.getElementById('stat-cpu').textContent = cpuMatch[1] + '%';
          if (freeMem && totalMem) {
            const used = Math.round((1 - parseInt(freeMem[1]) / parseInt(totalMem[1])) * 100);
            document.getElementById('stat-ram').textContent = used + '%';
          }
        } catch (e) {}
      }
      
      if (data.commandType === 'location' && data.result) {
        try {
          const loc = typeof data.result === 'string' ? JSON.parse(data.result) : data.result;
          if (loc.location) updateLaptopLocation(loc.location);
        } catch (e) {}
      }
    }

    function confirmShutdown() {
      if (confirm('Shutdown the laptop?')) {
        sendCommand('shutdown');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ============= BUTTON HANDLERS =============
    function tryConnect() {
      pairKey = getEnteredCode();
      
      if (pairKey.length !== CODE_LENGTH) {
        document.getElementById('pair-error').textContent = `Enter all ${CODE_LENGTH} characters`;
        return;
      }

      document.getElementById('connect-btn').disabled = true;
      document.getElementById('connect-btn').textContent = 'Connecting...';
      document.getElementById('pair-error').textContent = '';
      
      connectWebSocket();
    }

    // ============= INITIALIZATION =============
    detectDevice();

    if (isLaptop) {
      // LAPTOP MODE
      document.getElementById('pair-title').textContent = 'Laptop Mode';
      document.getElementById('pair-subtitle').textContent = 'Generate a code and enter it on your phone';
      document.getElementById('laptop-section').style.display = 'block';
      document.getElementById('phone-section').style.display = 'none';
      
      // Generate initial code
      currentCode = generateCode();
      displayCode(currentCode);
      
      // Generate button
      document.getElementById('generate-btn').addEventListener('click', () => {
        currentCode = generateCode();
        displayCode(currentCode);
        document.getElementById('wait-text').style.display = 'none';
        document.getElementById('wait-text').innerHTML = '<span class="spinner"></span><br>Waiting for phone to connect...';
        document.getElementById('wait-text').style.color = '#00d4ff';
        
        // Reconnect with new code
        if (ws) ws.close();
        connectWebSocket();
      });
      
      // Copy button
      document.getElementById('copy-code-btn').addEventListener('click', () => {
        navigator.clipboard?.writeText(currentCode);
        showToast('Code copied!');
      });
      
      // Auto-connect
      connectWebSocket();
      
    } else {
      // PHONE MODE
      document.getElementById('pair-title').textContent = 'Connect to Laptop';
      document.getElementById('pair-subtitle').textContent = 'Enter the code shown on your laptop';
      document.getElementById('laptop-section').style.display = 'none';
      document.getElementById('phone-section').style.display = 'block';
      
      createInputBoxes();
      
      document.getElementById('connect-btn').addEventListener('click', tryConnect);
    }
  </script>
</body>
</html>
