<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>Laptop Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Pairing Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-overlay.hidden { display: none; }

    .modal {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .modal-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }

    .modal h2 { font-size: 22px; margin-bottom: 8px; }
    .modal p { color: #888; font-size: 13px; margin-bottom: 24px; }

    .pair-key-input {
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 8px;
      text-transform: uppercase;
      outline: none;
      margin-bottom: 16px;
    }

    .pair-key-input:focus { border-color: #00d4ff; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      color: #fff;
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary:active { transform: scale(0.98); }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      margin-top: 10px;
    }

    .error-text { color: #ff4444; font-size: 12px; margin-top: 10px; min-height: 18px; }

    /* Main App */
    #app { display: none; min-height: 100vh; padding-bottom: 200px; }
    #app.active { display: block; }

    .header {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px;
      z-index: 100;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .device-info { display: flex; align-items: center; gap: 10px; }

    .device-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .device-name { font-size: 15px; font-weight: 600; }

    .status-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #888;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }

    .status-dot.online { background: #00ff88; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Map */
    #map {
      position: fixed;
      top: 65px; left: 0; right: 0;
      height: 40vh;
      z-index: 1;
    }

    /* Info Panel */
    .info-panel {
      position: relative;
      z-index: 10;
      margin-top: calc(40vh + 65px);
      padding: 16px;
    }

    .info-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .info-row:last-child { border-bottom: none; }
    .info-label { color: #888; font-size: 13px; }
    .info-value { font-size: 13px; font-weight: 500; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 10px; color: #888; margin-top: 4px; }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 16px;
      border-radius: 20px 20px 0 0;
      z-index: 100;
    }

    .controls-handle {
      width: 36px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 12px;
    }

    .alarm-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .alarm-btn {
      padding: 12px 6px;
      border: none;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      transition: all 0.2s;
    }

    .alarm-btn:active { transform: scale(0.92); }
    .alarm-btn .icon { font-size: 20px; }

    .alarm-btn.siren { background: linear-gradient(135deg, #ff4444, #cc0000); }
    .alarm-btn.alarm { background: linear-gradient(135deg, #ff8800, #cc6600); }
    .alarm-btn.noise { background: linear-gradient(135deg, #ff00ff, #cc00cc); }
    .alarm-btn.sensor { background: linear-gradient(135deg, #ffff00, #cccc00); color: #000; }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .action-btn {
      padding: 12px 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #fff;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .action-btn:active { background: rgba(255,255,255,0.15); }
    .action-btn .icon { font-size: 18px; }
    .action-btn.danger { border-color: rgba(255,68,68,0.3); color: #ff4444; }

    /* Toast */
    .toast {
      position: fixed;
      top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(0,212,255,0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Custom marker */
    .custom-marker { background: none; border: none; }
    .marker-dot {
      width: 20px; height: 20px;
      background: #00d4ff;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,212,255,0.5);
    }

    .marker-phone {
      width: 20px; height: 20px;
      background: #00ff88;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,255,136,0.5);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Pairing Modal -->
  <div class="modal-overlay" id="pairing-modal">
    <div class="modal">
      <div class="modal-icon">🔗</div>
      <h2>Pair with Laptop</h2>
      <p>Enter the 8-digit pair key shown on your laptop agent</p>
      <input type="text" class="pair-key-input" id="pair-key-input" 
             maxlength="8" placeholder="XXXXXXXX" autocomplete="off">
      <button class="btn btn-primary" id="pair-btn" disabled>Connect</button>
      <button class="btn btn-secondary" id="generate-btn">Generate New Key</button>
      <div class="error-text" id="pair-error"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app">
    <header class="header">
      <div class="header-content">
        <div class="device-info">
          <div class="device-icon">💻</div>
          <div>
            <div class="device-name" id="device-name">Laptop</div>
            <div class="status-badge">
              <div class="status-dot" id="status-dot"></div>
              <span id="status-text">Connecting...</span>
            </div>
          </div>
        </div>
        <div style="font-size:11px; color:#888;" id="last-seen">--</div>
      </div>
    </header>

    <div id="map"></div>

    <div class="info-panel">
      <div class="section-title">Laptop Location</div>
      <div class="info-card">
        <div class="info-row">
          <span class="info-label">City</span>
          <span class="info-value" id="loc-city">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Region</span>
          <span class="info-value" id="loc-region">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Country</span>
          <span class="info-value" id="loc-country">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">IP</span>
          <span class="info-value" id="loc-ip">--</span>
        </div>
        <div class="info-row">
          <span class="info-label">Coordinates</span>
          <span class="info-value" id="loc-coords">--</span>
        </div>
      </div>

      <div class="section-title">System Status</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="stat-cpu">--</div>
          <div class="stat-label">CPU</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-ram">--</div>
          <div class="stat-label">RAM</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-uptime">--</div>
          <div class="stat-label">Uptime</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="controls-handle"></div>
      
      <div class="section-title">Alarms</div>
      <div class="alarm-grid">
        <button class="alarm-btn siren" onclick="sendCommand('siren')">
          <span class="icon">🚨</span> Siren
        </button>
        <button class="alarm-btn alarm" onclick="sendCommand('alarm')">
          <span class="icon">🔔</span> Alarm
        </button>
        <button class="alarm-btn noise" onclick="sendCommand('noise')">
          <span class="icon">🔊</span> Noise
        </button>
        <button class="alarm-btn sensor" onclick="sendCommand('sensor')">
          <span class="icon">⚠️</span> Sensor
        </button>
      </div>

      <div class="section-title">Actions</div>
      <div class="action-grid">
        <button class="action-btn" onclick="sendCommand('lock')">
          <span class="icon">🔒</span> Lock
        </button>
        <button class="action-btn" onclick="sendCommand('netscan')">
          <span class="icon">🌐</span> Scan
        </button>
        <button class="action-btn" onclick="sendCommand('sysinfo')">
          <span class="icon">📊</span> Info
        </button>
        <button class="action-btn danger" onclick="confirmShutdown()">
          <span class="icon">⏻</span> Shutdown
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let ws = null;
    let map = null;
    let laptopMarker = null;
    let phoneMarker = null;
    let deviceId = null;
    let pairKey = localStorage.getItem('pairKey') || '';

    // Elements
    const pairingModal = document.getElementById('pairing-modal');
    const pairKeyInput = document.getElementById('pair-key-input');
    const pairBtn = document.getElementById('pair-btn');
    const generateBtn = document.getElementById('generate-btn');
    const pairError = document.getElementById('pair-error');
    const app = document.getElementById('app');

    // Auto-fill saved pair key
    if (pairKey) {
      pairKeyInput.value = pairKey;
      pairBtn.disabled = false;
    }

    // Pair key input
    pairKeyInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-F0-9]/g, '');
      pairBtn.disabled = e.target.value.length !== 8;
    });

    // Connect button
    pairBtn.addEventListener('click', () => {
      pairKey = pairKeyInput.value;
      localStorage.setItem('pairKey', pairKey);
      connectToCloud();
    });

    // Generate new key button
    generateBtn.addEventListener('click', () => {
      const newKey = Array.from(crypto.getRandomValues(new Uint8Array(4)))
        .map(b => b.toString(16).padStart(2, '0').toUpperCase())
        .join('');
      pairKeyInput.value = newKey;
      pairKey = newKey;
      pairBtn.disabled = false;
      navigator.clipboard?.writeText(newKey);
      showToast('Key copied! Run agent with this key');
    });

    function connectToCloud() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({
          type: 'phone_connect',
          pairKey
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };

      ws.onclose = () => {
        document.getElementById('status-dot').classList.remove('online');
        document.getElementById('status-text').textContent = 'Disconnected';
        setTimeout(connectToCloud, 3000);
      };
    }

    function handleMessage(data) {
      switch (data.type) {
        case 'connected':
          if (data.isOnline) {
            pairingModal.classList.add('hidden');
            app.classList.add('active');
            document.getElementById('status-dot').classList.add('online');
            document.getElementById('status-text').textContent = 'Online';
            document.getElementById('device-name').textContent = data.deviceInfo?.hostname || 'Laptop';
            deviceId = data.deviceId;
            
            if (!map) initMap();
            
            if (data.deviceLocation) {
              updateLaptopLocation(data.deviceLocation);
            }
          } else {
            pairError.textContent = 'Laptop is offline. Make sure agent is running.';
          }
          break;

        case 'device_paired':
          pairingModal.classList.add('hidden');
          app.classList.add('active');
          deviceId = data.deviceId;
          document.getElementById('device-name').textContent = data.deviceInfo?.hostname || 'Laptop';
          document.getElementById('status-dot').classList.add('online');
          document.getElementById('status-text').textContent = 'Online';
          if (!map) initMap();
          break;

        case 'location_update':
          updateLaptopLocation(data.location);
          document.getElementById('last-seen').textContent = 
            new Date(data.timestamp).toLocaleTimeString();
          break;

        case 'command_result':
          handleCommandResult(data);
          break;
      }
    }

    function initMap() {
      map = L.map('map', {
        center: [20, 0],
        zoom: 2,
        zoomControl: false
      });

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      setTimeout(() => map.invalidateSize(), 300);

      // Track phone location
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            if (phoneMarker) {
              phoneMarker.setLatLng([latitude, longitude]);
            } else {
              phoneMarker = L.marker([latitude, longitude], {
                icon: L.divIcon({
                  className: 'custom-marker',
                  html: '<div class="marker-phone"></div>',
                  iconSize: [20, 20],
                  iconAnchor: [10, 10]
                })
              }).addTo(map);
            }
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
    }

    function updateLaptopLocation(location) {
      if (!map || !location) return;

      const latlng = [location.lat, location.lng];

      if (laptopMarker) {
        laptopMarker.setLatLng(latlng);
      } else {
        laptopMarker = L.marker(latlng, {
          icon: L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-dot"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          })
        }).addTo(map);
      }

      map.setView(latlng, 13);

      document.getElementById('loc-city').textContent = location.city || '--';
      document.getElementById('loc-region').textContent = location.region || '--';
      document.getElementById('loc-country').textContent = location.country || '--';
      document.getElementById('loc-ip').textContent = location.ip || '--';
      document.getElementById('loc-coords').textContent = 
        `${location.lat?.toFixed(4)}, ${location.lng?.toFixed(4)}`;
    }

    function sendCommand(type, params = {}) {
      if (!deviceId) {
        showToast('Not connected to laptop');
        return;
      }

      fetch('/api/command/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceId, type, params })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showToast(`${type} command sent!`);
        } else {
          showToast('Failed to send command');
        }
      })
      .catch(() => showToast('Error sending command'));
    }

    function handleCommandResult(data) {
      if (data.commandType === 'sysinfo' && data.result) {
        parseSystemInfo(data.result);
      } else if (data.commandType === 'location' && data.result) {
        try {
          const loc = typeof data.result === 'string' ? JSON.parse(data.result) : data.result;
          if (loc.location) updateLaptopLocation(loc.location);
        } catch (e) {}
      }
      showToast(data.error ? `Error: ${data.error}` : 'Command completed');
    }

    function parseSystemInfo(output) {
      try {
        const cpuMatch = output.match(/LoadPercentage=(\d+)/);
        const ramMatch = output.match(/FreePhysicalMemory=(\d+)/);
        const totalRamMatch = output.match(/TotalVisibleMemorySize=(\d+)/);
        const uptimeMatch = output.match(/(\d+)s/);
        
        if (cpuMatch) document.getElementById('stat-cpu').textContent = cpuMatch[1] + '%';
        if (ramMatch && totalRamMatch) {
          const used = Math.round((1 - parseInt(ramMatch[1]) / parseInt(totalRamMatch[1])) * 100);
          document.getElementById('stat-ram').textContent = used + '%';
        }
      } catch (e) {}
    }

    function confirmShutdown() {
      if (confirm('Shutdown the laptop?')) {
        sendCommand('shutdown');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
